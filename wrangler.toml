name = "cms"
main = "index.js"
compatibility_date = "2026-09-01"

# Set these via `wrangler secret put` — never commit real values:
#   SUPABASE_URL                    (pre-con/CRM project: atmrjimfcydgjonlxzvr)
#   SUPABASE_SERVICE_ROLE_KEY       (server-side only — pages/blocks_library/leads/contacts)
#   MLS_SUPABASE_URL                (MLS/DDF project: nkjxlwuextxzpeohutxz)
#   MLS_SUPABASE_SERVICE_ROLE_KEY   (server-side only — reads grid/property for listing blocks)
#
# These are two SEPARATE Supabase projects (separate databases, no cross-project
# joins) — see the earlier discussion on why MLS sync and CRM/pages are split.
# Both sets of secrets are required for index.js to render real-estate blocks.
#
# [vars] section is for non-secret config only.
[vars]
SITE_NAME = "GetSetSold.ca"

# Enables live logs (Cloudflare dashboard -> Workers & Pages -> cms -> Logs,
# or `npx wrangler tail` from workers/src) so we can see the real error
# instead of guessing why listings aren't rendering.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
