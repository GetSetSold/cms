name = "cms"
main = "index.js"
compatibility_date = "2026-09-01"

# Only the two SERVICE ROLE KEYS are actually sensitive — set those via
# `wrangler secret put` (never commit them):
#   SUPABASE_SERVICE_ROLE_KEY       (server-side only — pages/blocks_library/leads/contacts)
#   MLS_SUPABASE_SERVICE_ROLE_KEY   (server-side only — reads grid/property for listing blocks)
#
# The project URLs are not secret (they're public Supabase project refs),
# so they live here in [vars] instead of as dashboard secrets — this is the
# fix for the "deploy wipes my variables" problem: [vars] is committed to
# the repo and is the actual source of truth wrangler deploy uses, so
# nothing here can be silently lost the way dashboard-only entries can be.
#
# These are two SEPARATE Supabase projects (separate databases, no cross-project
# joins) — see the earlier discussion on why MLS sync and CRM/pages are split.
[vars]
SITE_NAME = "Rohit Sharma Real Estate"
SUPABASE_URL = "https://atmrjimfcydgjonlxzvr.supabase.co"
MLS_SUPABASE_URL = "https://nkjxlwuextxzpeohutxz.supabase.co"

# Enables live logs (Cloudflare dashboard -> Workers & Pages -> cms -> Logs,
# or `npx wrangler tail` from workers/src) so we can see the real error
# instead of guessing why listings aren't rendering.
[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true
